name: CI/CD Pipeline - Market List

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Market_List_API/MarketList_API/MarketList_API.csproj

    - name: Build Backend
      run: dotnet build Market_List_API/Market_List_API.sln --configuration Release --no-restore

    - name: Run Backend Tests
      run: dotnet test Market_List_API/Market_List_API.sln --configuration Release --no-build --verbosity normal

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        cd Market_List_Front
        npm ci

    - name: Build Frontend
      run: |
        cd Market_List_Front
        npm run build

  docker-publish:
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push API Image
      uses: docker/build-push-action@v4
      with:
        context: ./Market_List_API
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/marketlist-api:latest
          ghcr.io/${{ github.repository }}/marketlist-api:${{ github.sha }}

    - name: Build and push Frontend Image
      uses: docker/build-push-action@v4
      with:
        context: ./Market_List_Front
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/marketlist-front:latest
          ghcr.io/${{ github.repository }}/marketlist-front:${{ github.sha }}
